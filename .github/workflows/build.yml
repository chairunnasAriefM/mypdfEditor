name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2

      - name: Resolve Go modules
        run: go mod tidy

      - name: Build (single portable .exe)
        run: wails build -clean -platform windows/amd64 -webview2 embed -o PDFBubble.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFBubble-windows-amd64
          path: build/bin/PDFBubble.exe
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/PDFBubble.exe
          generate_release_notes: true
